<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <meta
      name="description"
      content="Organiza, ordena y haz seguimiento de tus Objetivos de Aprendizaje."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232563eb'/%3E%3Cpath d='M28 52l14 14 30-32' stroke='white' stroke-width='11' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>Objetivos de Aprendizaje</title>
    <script>
      // Se ejecuta antes de pintar: sin esto la página aparecería clara un
      // instante antes de que React aplique el tema guardado (parpadeo).
      (function () {
        try {
          var temas = ['claro', 'oscuro', 'azul-noche', 'azul-educativo', 'auto'];
          var acentos = ['azul', 'verde', 'violeta', 'naranja'];
          var tema = localStorage.getItem('oa-manager:theme');
          var acento = localStorage.getItem('oa-manager:accent');
          if (temas.indexOf(tema) === -1) tema = 'auto';
          if (acentos.indexOf(acento) === -1) acento = 'azul';
          if (tema === 'auto') {
            tema = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
          }
          document.documentElement.dataset.theme = tema;
          document.documentElement.dataset.accent = acento;
        } catch (e) {
          document.documentElement.dataset.theme = 'claro';
          document.documentElement.dataset.accent = 'azul';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
