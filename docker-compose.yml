services:
  db:
    image: postgres:16-alpine
    container_name: oa_manager_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: oa_user
      POSTGRES_PASSWORD: oa_password
      POSTGRES_DB: oa_manager
    ports:
      - "5432:5432"
    volumes:
      - oa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oa_user -d oa_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: oa_manager_adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"

volumes:
  oa_pgdata:
